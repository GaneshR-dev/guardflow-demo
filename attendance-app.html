<head>

<title>Guardian Attendance</title>
<style>
:root{--blue:#2367ea;--blue2:#1d5ee8;--navy:#10284c;--text:#172238;--muted:#68778d;--line:#dfe7f2;--soft:#eef4fb;--green:#17a36b;--greenSoft:#dff7eb;--amber:#a86200;--amberSoft:#fff0d8;--red:#c73d4d;--card:#fff;--shadow:0 16px 40px rgba(20,45,90,.10)}
*{box-sizing:border-box}body{margin:0;background:#e9edf3;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:430px;min-height:100vh;margin:0 auto;background:#f7faff;box-shadow:0 0 0 1px #d9e1ec,0 18px 60px rgba(0,0,0,.10);position:relative}.page{min-height:100vh;padding:22px 22px 120px}.page.noNav{padding-bottom:28px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.menuButton,.iconButton{width:40px;height:40px;border:0;border-radius:12px;background:#edf4ff;color:var(--blue);font-size:22px;font-weight:800}.brand{color:var(--navy);font-size:13px;font-weight:800;letter-spacing:.2px}.logo{width:58px;height:58px;border-radius:16px;background:linear-gradient(145deg,#2475f0,#1452c8);color:white;display:grid;place-items:center;font-size:28px;font-weight:800;margin:60px 0 28px}.login h1,.page h1{font-size:27px;line-height:1.15;margin:0 0 7px;letter-spacing:-.5px}.sub{color:var(--muted);font-size:14px;margin:0 0 24px}.field{margin:0 0 16px}.field label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}.field input,.field select,.search{width:100%;height:54px;border:1px solid transparent;background:#edf3f9;border-radius:12px;padding:0 16px;color:var(--text);outline:none}.field input:focus,.field select:focus,.search:focus{border-color:var(--blue);background:#fff}.forgot{text-align:right;margin:-6px 0 22px}.forgot a,.link{border:0;background:transparent;padding:0;color:var(--blue);font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;appearance:none}.primary{width:100%;height:54px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;box-shadow:0 8px 20px rgba(35,103,234,.18)}.primary:disabled{opacity:.55;cursor:not-allowed}.secondary{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--blue);font-weight:800}.demoBox{margin-top:24px;padding:13px 14px;border-left:3px solid var(--blue);background:#eaf2ff;font-size:11px;line-height:1.55;color:#4d5f78}.demoBox b{display:block;color:var(--blue);letter-spacing:.7px;font-size:10px}.footerNote{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:#8b98aa;font-size:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 10px rgba(21,50,90,.04)}.locationCard{display:flex;align-items:center;gap:13px;padding:17px 15px;margin:12px 0;text-align:left;width:100%;border:1px solid transparent;background:#fff;border-radius:14px;box-shadow:0 3px 10px rgba(21,50,90,.04)}.locationCard.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.locIcon{width:42px;height:42px;border-radius:12px;background:#eaf2ff;color:var(--blue);display:grid;place-items:center;font-size:21px}.locationCard strong{display:block;font-size:14px}.locationCard span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.chev{margin-left:auto;color:#7d8ca0;font-size:22px}.helper{text-align:center;color:#7c8a9b;font-size:11px;margin-top:26px}.hero{background:var(--navy);color:#fff;border-radius:14px;padding:17px 18px;margin:18px 0 14px}.hero small{display:block;font-size:9px;letter-spacing:.8px;color:#b7c8df;font-weight:800}.hero strong{font-size:26px}.hero span{font-size:12px;color:#d6e3f3}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stat{padding:12px;border-radius:12px;background:#fff;border:1px solid var(--line);text-align:center}.stat strong{display:block;font-size:20px}.stat.green strong{color:var(--green)}.stat.amber strong{color:var(--amber)}.stat.blue strong{color:var(--blue)}.stat span{font-size:10px;color:var(--muted)}.sectionTitle{font-size:17px;margin:18px 0 12px}.search{height:48px;margin-bottom:11px}.filters{display:flex;gap:7px;margin:0 0 12px}.chip{border:0;border-radius:8px;padding:6px 10px;font-size:10px;background:#eef3f8;color:#607084}.chip.active{background:#e8f1ff;color:var(--blue);font-weight:800}.chip.green{background:var(--greenSoft);color:var(--green)}.chip.amber{background:var(--amberSoft);color:var(--amber)}.person{display:flex;align-items:center;gap:11px;padding:12px;margin:8px 0;border-radius:12px;background:#fff;border:1px solid var(--line)}.person .initials{width:38px;height:38px;border-radius:50%;background:#eaf2ff;color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:800}.person strong{display:block;font-size:13px}.person small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.personTime{margin-left:auto;text-align:right;font-size:11px}.badge{display:inline-block;border-radius:7px;padding:4px 7px;font-size:9px;font-weight:800}.badge.green{background:var(--greenSoft);color:var(--green)}.badge.amber{background:var(--amberSoft);color:var(--amber)}.badge.blue{background:#e8f1ff;color:var(--blue)}.selectBtn{margin-left:auto;border:0;border-radius:8px;background:var(--blue);color:#fff;padding:8px 13px;font-size:11px;font-weight:800}.outlineBtn{margin-left:auto;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--blue);padding:8px 12px;font-size:11px;font-weight:800}.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);height:72px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.navItem{border:0;background:#fff;color:#718096;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px}.navItem b{font-size:19px;font-weight:500}.navItem.active{color:var(--blue);font-weight:800}.addCard{padding:17px;margin:12px 0}.addCard p{font-size:12px;color:var(--muted);margin:0 0 10px}.selected{background:var(--greenSoft);border:1px solid #bde7d2;color:#0f6d49;padding:13px;border-radius:10px;font-size:12px;margin:15px 0}.successIcon{width:86px;height:86px;border-radius:50%;background:var(--greenSoft);color:var(--green);display:grid;place-items:center;font-size:48px;margin:44px auto 22px}.confirm{text-align:center}.confirm h1{font-size:22px}.confirmCard{margin:25px 0;padding:24px 18px;text-align:center}.timeLabel{font-size:10px;letter-spacing:.7px;color:var(--muted);font-weight:800;margin-top:20px}.bigTime{font-size:25px;font-weight:800;margin:5px 0 2px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dashStat{padding:13px;border-radius:12px;background:#fff;border:1px solid var(--line)}.dashStat strong{font-size:22px}.dashStat span{display:block;color:var(--muted);font-size:10px}.listCard{padding:14px 15px;margin:10px 0;display:flex;align-items:center;justify-content:space-between}.listCard strong{font-size:13px}.listCard small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.navPanel{min-height:100vh;background:#f7faff;padding:22px}.navLink{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;margin:9px 0;border:0;border-radius:12px;background:#fff;color:var(--text);text-align:left;box-shadow:0 2px 8px rgba(21,50,90,.04)}.navLink strong{font-size:14px}.navLink small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.notice{padding:12px;border-radius:10px;background:#fff7e6;color:#805500;font-size:12px;margin:10px 0}.error{padding:12px;border-radius:10px;background:#ffecef;color:#9b1c2e;font-size:12px;margin:10px 0}.muted{color:var(--muted)}.small{font-size:11px}.reportRow{display:grid;grid-template-columns:1.1fr .7fr .7fr .8fr;}.reportRow.employee{grid-template-columns:.85fr 1.15fr .65fr .65fr .55fr;}gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:11px}.reportRow.head{font-weight:800;color:var(--muted);font-size:10px}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:min(386px,calc(100% - 32px));padding:13px 15px;border-radius:12px;background:#10284c;color:#fff;font-size:12px;box-shadow:var(--shadow);z-index:20}@media (max-width:380px){.page{padding-left:16px;padding-right:16px}.stats{gap:7px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const $app=document.getElementById('app');
const API=(new URLSearchParams(location.search).get('api')||'').replace(/\/$/,'');
const todayISO=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(d);
const fmtMonth=d=>new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric'}).format(d);
const fmtTime=v=>v?new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date(v)):'-';
const initials=n=>n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const plural=(n,one,many=one+'s')=>n===1?`${n} ${one}`:`${n} ${many}`;
function slugId(value,prefix='loc'){let s=(value||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');if(!s)s='new';if(!s.startsWith(prefix+'-'))s=prefix+'-'+s;return s.slice(0,40).replace(/-+$/,'')||prefix+'-new'}
function uniqueId(base,taken){let id=base,i=2;while(taken.includes(id)){const suffix='-'+i;id=base.slice(0,40-suffix.length)+suffix;i++}return id}
function newLocationId(name){return uniqueId(slugId(name,'loc'),state.locations.map(l=>l.id))}
const state={token:localStorage.getItem('gf_token')||'',user:JSON.parse(localStorage.getItem('gf_user')||'null'),screen:'login',locations:[],location:null,attendance:[],summary:{},employees:[],dashboard:null,history:[],monthly:null,reportMode:'',reportDate:'',reportMonth:'',reportLocation:'',settings:null,settingsView:'',showLocationForm:false,selected:null,lastCheck:null,query:'',locationQuery:'',addQuery:'',employeeQuery:'',showEmployeeForm:false,filter:'all',notice:'',error:'',localMode:false,localDB:null};
const demoLocations=[{id:'loc-hsr',name:'Bengaluru - HSR Layout',area:'HSR Sector 2',assigned_count:24},{id:'loc-whitefield',name:'Bengaluru - Whitefield',area:'ITPL Main Road',assigned_count:18},{id:'loc-mysuru',name:'Mysuru - City Centre',area:'Devaraja Mohalla',assigned_count:12}];
const demoNames=['Deepak Kumar','Ananya Rao','Rohan K','Sneha P','Vikram P','Meera Shah','Arjun Verma','Kiran S','Naveen R','Priya N','Suresh M','Divya L','Manoj T','Asha V','Ravi B','Pooja H','Imran A','Nisha D','Tarun J','Latha G','Vivek N','Sana F','Harish Q','Geeta W'];
function seedLocal(){
 if(state.localDB)return state.localDB;
 const employees=demoNames.map((name,i)=>({id:'EMP'+(1024+i),name,phone:'+91 90000 '+(11024+i),role:i===0?'Senior Guard':'Guard',location_id:'loc-hsr',active:1}));
 const rows=[]; const now=new Date();
 for(let d=183;d>=1;d--){const day=new Date(now);day.setDate(now.getDate()-d);const ds=day.toISOString().slice(0,10);employees.forEach((e,i)=>{if((i*17+day.getDate()*11+day.getMonth()*5)%100<88){rows.push({id:'a-'+e.id+'-'+ds,employee_id:e.id,name:e.name,location_id:e.location_id,day:ds,status:'completed',check_in:new Date(day.setHours(8+(i%3),(i*7)%60,0,0)).toISOString(),check_out:new Date(day.setHours(17+(i%3),(i*11)%60,0,0)).toISOString(),source:'fictional sample history'})}})}
 employees.forEach((e,i)=>{let status=i<16?'checked_in':(i<19?'completed':'not_in');rows.push({id:'a-'+e.id+'-'+todayISO(),employee_id:e.id,name:e.name,location_id:e.location_id,day:todayISO(),status,check_in:status==='not_in'?null:new Date(new Date().setHours(8,40+i%12,0,0)).toISOString(),check_out:status==='completed'?new Date(new Date().setHours(17,20+i,0,0)).toISOString():null,source:'fictional sample history'})});
 state.localDB={employees,rows}; return state.localDB;
}
function toast(msg){const id=Date.now();state.toastId=id;state.notice=msg;render();setTimeout(()=>{if(state.toastId===id){state.notice='';render()}},2400)}
async function api(path,opts={}){
 if(state.localMode)return localApi(path,opts);
 const res=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(state.token?{Authorization:'Bearer '+state.token}:{})}});
 const text=await res.text();let data;try{data=JSON.parse(text)}catch{data={detail:text}}
 if(!res.ok){const detail=Array.isArray(data.detail)?data.detail.map(x=>x.msg||x.message||String(x)).join('; '):data.detail;throw new Error(detail||'Request failed')}return data;
}
async function localApi(path,opts={}){
 const db=seedLocal();const body=opts.body?JSON.parse(opts.body):{};
 if(path==='/api/login'){const ok={admin:'admin.demo',supervisor:'supervisor.demo',demo:'demo'};const role=body.username==='admin.demo'?'admin':'supervisor';if(Object.values(ok).includes(body.username)&&body.password==='demo123')return{token:'local',user:{id:body.username,name:body.username==='admin.demo'?'Admin Demo':'Supervisor Demo',role}};throw new Error('Invalid user ID or password')}
 if(path==='/api/locations')return demoLocations;
 if(path==='/api/employees/import'&&opts.method==='POST'){let created=0,updated=0;body.rows.forEach(row=>{const id=row.id||'EMP'+(4000+db.employees.length);const old=db.employees.find(e=>e.id===id);if(old){Object.assign(old,row);updated++}else{db.employees.push({id,...row,active:1});created++}});return{created,updated}}
 if(path.startsWith('/api/employees')&&opts.method==='POST'){const e={id:'EMP'+(4000+db.employees.length),...body,active:1};db.employees.push(e);return e}
 if(path.startsWith('/api/employees'))return db.employees.filter(e=>(!path.includes('location_id=')||e.location_id===new URLSearchParams(path.split('?')[1]).get('location_id')));
 if(path.startsWith('/api/attendance?')){const p=new URLSearchParams(path.split('?')[1]);const loc=p.get('location_id'),day=p.get('day')||todayISO(),q=(p.get('q')||'').toLowerCase(),st=p.get('status')||'';let rows=db.rows.filter(r=>r.location_id===loc&&r.day===day).map(r=>({...r,name:db.employees.find(e=>e.id===r.employee_id)?.name||r.employee_id,role:'Guard'}));if(q)rows=rows.filter(r=>(r.name+' '+r.employee_id).toLowerCase().includes(q));if(st)rows=rows.filter(r=>r.status===st);return{day,summary:{checked_in:rows.filter(r=>r.status==='checked_in').length,completed:rows.filter(r=>r.status==='completed').length,not_in:rows.filter(r=>r.status==='not_in').length},rows}}
 if(path==='/api/attendance/checkin'){const r=db.rows.find(r=>r.employee_id===body.employee_id&&r.day===todayISO());if(r&&r.status!=='not_in')throw new Error('Employee is already checked in');if(r){r.status='checked_in';r.check_in=new Date().toISOString();r.check_out=null}else db.rows.push({id:Math.random(),employee_id:body.employee_id,location_id:body.location_id,day:todayISO(),status:'checked_in',check_in:new Date().toISOString(),check_out:null});const e=db.employees.find(e=>e.id===body.employee_id);return{employee_id:e.id,name:e.name,status:'checked_in',check_in:new Date().toISOString()}}
 if(path==='/api/attendance/checkout'){const r=db.rows.find(r=>r.employee_id===body.employee_id&&r.day===todayISO()&&r.status==='checked_in');if(!r)throw new Error('Employee is not currently checked in');r.status='completed';r.check_out=new Date().toISOString();const e=db.employees.find(e=>e.id===body.employee_id);return{employee_id:e.id,name:e.name,status:'completed',check_out:r.check_out}}
 if(path==='/api/dashboard'){const today=db.rows.filter(r=>r.day===todayISO());return{day:todayISO(),employees:db.employees.length,checked_in:today.filter(r=>r.status==='checked_in').length,completed:today.filter(r=>r.status==='completed').length,not_checked_in:db.employees.length-today.filter(r=>r.status!=='not_in').length,locations:demoLocations.map(l=>({...l,today:{checked_in:today.filter(r=>r.location_id===l.id&&r.status==='checked_in').length,completed:today.filter(r=>r.location_id===l.id&&r.status==='completed').length,not_in:today.filter(r=>r.location_id===l.id&&r.status==='not_in').length}}))}}
 if(path.startsWith('/api/reports/months')){const out=[];const now=new Date();for(let m=0;m<6;m++){const d=new Date(now.getFullYear(),now.getMonth()-m,1);const key=d.toISOString().slice(0,7);const rows=db.rows.filter(r=>r.day.startsWith(key));out.push({month:key,checked_in:0,completed:rows.length,not_in:0,total_records:rows.length})}return out}
 if(path==='/api/settings/profile'&&opts.method==='PATCH'){state.user.name=body.name;return{id:state.user.id,name:body.name,role:state.user.role}}
 if(path==='/api/settings/locations/import'&&opts.method==='POST'){let created=0,updated=0;body.rows.forEach(row=>{const id=row.id||('loc-'+row.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''));const old=demoLocations.find(l=>l.id===id);if(old){Object.assign(old,row,{id});updated++}else{demoLocations.push({...row,id,assigned_count:0});created++}});return{created,updated}}
 if(path==='/api/settings/locations'&&opts.method==='POST'){demoLocations.push({...body,assigned_count:0});return body}
 if(path==='/api/settings/access'&&opts.method==='POST')return{id:body.id,name:body.name,role:body.role,location_ids:body.location_ids}
 if(path==='/api/settings')return{profile:{name:state.user.name,id:state.user.id,role:state.user.role},locations:demoLocations,access:[{id:'admin.demo',name:'Admin Demo',role:'admin',location_ids:[]},{id:'supervisor.demo',name:'Supervisor Demo',role:'supervisor',location_ids:['loc-hsr','loc-whitefield']},{id:'demo',name:'Demo Supervisor',role:'supervisor',location_ids:['loc-hsr']}],data_notice:'Demo environment'};
 if(path.startsWith('/api/reports/monthly')){const p=new URLSearchParams(path.split('?')[1]);const month=p.get('month'),day=p.get('day'),loc=p.get('location_id');const rows=db.rows.filter(r=>r.day.startsWith(month)&&(!day||r.day===day)&&(!loc||r.location_id===loc)).map(r=>{const e=db.employees.find(x=>x.id===r.employee_id)||{};const hours=r.check_in&&r.check_out?((new Date(r.check_out)-new Date(r.check_in))/36e5).toFixed(2)*1:null;return{...r,employee_name:e.name||r.employee_id,location_name:demoLocations.find(l=>l.id===r.location_id)?.name||r.location_id,hours}});return{month,day,rows:rows.sort((a,b)=>b.day.localeCompare(a.day)),data_notice:'Fictional sample data only'}}
 return{};
}
function nav(){const items=[['home','⌂','Home'],['attendance','◷','Attendance'],['reports','▦','Reports'],['settings','⚙','Settings']];return`<div class="bottomNav">${items.map(([k,i,l])=>`<button class="navItem ${((k==='home'&&['home','dashboard'].includes(state.screen))||state.screen===k||(k==='attendance'&&['attendance','add','checkout','confirmed'].includes(state.screen)))?'active':''}" data-nav="${k}"><b>${i}</b>${l}</button>`).join('')}</div>`}
function header(){return`<div class="top"><button class="menuButton" data-go="menu">☰</button><span class="brand">Guardian</span></div>`}
function message(){return`${state.error?`<div class="error">${state.error}</div>`:''}${state.localMode?`<div class="notice">Backend unavailable. Showing browser-local fictional sample data.</div>`:''}${state.notice?`<div class="toast">${state.notice}</div>`:''}`}
function login(){return`<div class="page noNav login"><div class="logo">G</div><h1>Guardian</h1><p class="sub">Sign in to manage today's attendance</p><form id="loginForm"><div class="field"><label>User ID</label><input name="username" placeholder="Enter your user ID" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required></div><div class="forgot"><button type="button" class="link" id="forgot">Forgot password?</button></div><button class="primary">Sign in</button></form><div class="demoBox"><b>DEMO ACCESS</b>Admin: admin.demo / demo123<br>Supervisor: supervisor.demo / demo123<br>Demo: demo / demo123</div><div class="footerNote">© 2026 Guardian</div></div>${message()}`}
function locations(){const shown=state.locations.filter(l=>!state.locationQuery||(l.name+' '+l.area).toLowerCase().includes(state.locationQuery.toLowerCase()));const empty=state.locationQuery?'No locations match.':'No locations yet.';const tools=state.user?.role==='admin'?`${[['directory','Location directory',plural(state.locations.length,'location')+' · Search by name or area'],['add','Add location','Create a new branch'],['import','Import locations','Upload a CSV location list']].map(([k,t,d])=>`<button class="navLink" data-locaction="${k}"><span><strong>${t}</strong><small>${d}</small></span><span>›</span></button>`).join('')}<input type="file" id="importLocationFile" accept=".csv,text/csv" style="display:none">${state.showLocationForm?`<div class="card addCard"><strong>Add location</strong><p>Create a branch supervisors can record attendance for.</p><form id="locationForm"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Area</label><input name="area" required></div><button class="secondary">Save location</button></form></div>`:''}`:'';return`<div class="page">${header()}<h1>Locations</h1><p class="sub">Select, add or import the branch where you are recording attendance.</p>${tools}<input class="search" id="locSearch" placeholder="Search locations" value="${state.locationQuery}"><div id="locationList">${shown.map(l=>`<button class="locationCard ${state.location?.id===l.id?'active':''}" data-loc="${l.id}"><span class="locIcon">✥</span><span><strong>${l.name}</strong><span>${l.area} · ${plural(l.assigned_count,'employee')}</span></span><span class="chev">›</span></button>`).join('')||`<p class="muted small">${empty}</p>`}</div><button class="primary" id="continueLoc" ${state.location?'':'disabled'}>Continue</button><p class="helper">You can switch locations later</p></div>${nav()}${message()}`}
function attendance(){const s=state.summary||{};const rows=state.attendance;const total=(s.checked_in||0)+(s.completed||0)+(s.not_in||0);return`<div class="page">${header()}<h1>Mark attendance</h1><p class="sub">${fmtDate(new Date())} · ${state.location?.name.split(' - ')[1]||''}</p><div class="hero"><small>TODAY'S ATTENDANCE</small><strong>${total}</strong> <span>${plural(total,'employee')} at this location</span></div><div class="stats"><div class="stat green"><strong>${s.checked_in||0}</strong><span>Checked in</span></div><div class="stat amber"><strong>${s.not_in||0}</strong><span>To check in</span></div><div class="stat blue"><strong>${s.completed||0}</strong><span>Completed</span></div></div><h2 class="sectionTitle">Employee attendance</h2><input class="search" id="attSearch" placeholder="Search by name or employee ID" value="${state.query}"><div class="filters"><button class="chip ${state.filter==='all'?'active':''}" data-filter="all">All ${(s.checked_in||0)+(s.completed||0)+(s.not_in||0)}</button><button class="chip green ${state.filter==='checked_in'?'active':''}" data-filter="checked_in">Checked in</button><button class="chip amber ${state.filter==='not_in'?'active':''}" data-filter="not_in">Not in</button></div>${rows.map(r=>`<div class="person"><span class="initials">${initials(r.name)}</span><span><strong>${r.name}</strong><small>${r.employee_id}</small></span><span class="personTime">${r.check_in?fmtTime(r.check_in):'-'}<br><span class="badge ${r.status==='checked_in'?'green':r.status==='completed'?'blue':'amber'}">${r.status==='checked_in'?'Checked in':r.status==='completed'?'Completed':'Not checked in'}</span></span></div>`).join('')||'<p class="muted small">No employees match.</p>'}<button class="primary" data-go="add">Mark Check-in · ${new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date())}</button><button class="secondary" style="margin-top:10px" data-go="checkout">Manage check-outs</button></div>${nav()}${message()}`}
function add(){const available=state.attendance.filter(r=>r.status==='not_in'&&(!state.addQuery||(r.name+' '+r.employee_id).toLowerCase().includes(state.addQuery.toLowerCase())));return`<div class="page">${header()}<h1>Add employee</h1><p class="sub">Choose an existing employee to record their check-in.</p><input class="search" id="addSearch" placeholder="Search name or employee ID" value="${state.addQuery}"><h2 class="sectionTitle">Available employees</h2>${available.map(r=>`<div class="person"><span class="initials">${initials(r.name)}</span><span><strong>${r.name}</strong><small>${r.employee_id}</small></span><button class="selectBtn" data-select="${r.employee_id}">Select</button></div>`).join('')||'<p class="muted small">No waiting employees match.</p>'}<div class="card addCard"><strong>Can't find the employee?</strong><p>Add a new employee to this location.</p><button class="link" id="toggleNew">+ Create new employee</button><form id="newEmployee" style="display:none;margin-top:14px"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone" required></div><button class="secondary">Save employee</button></form></div>${state.selected?`<div class="selected"><b>Selected employee: ${state.selected.name}</b><br>${state.selected.employee_id} · ${state.location.name}</div><button class="primary" id="doCheckin">Mark Check-in · ${new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date())}</button>`:''}</div>${nav()}${message()}`}
function confirmed(){const r=state.lastCheck;return`<div class="page">${header()}<h1>Check-in recorded</h1><p class="sub">Attendance has been successfully updated.</p><div class="card confirmCard"><div class="successIcon">✓</div><h2>${r?.name||'Employee'}</h2><p class="muted small">${r?.employee_id||''} · ${state.location?.name.split(' - ')[1]||''}</p><span class="badge green">CHECKED IN</span><div class="timeLabel">CHECK-IN TIME</div><div class="bigTime">${fmtTime(r?.check_in)}</div><div class="muted small">${fmtDate(new Date())}</div></div><button class="primary" data-go="add">+ Add another employee</button><p style="text-align:center;margin-top:16px"><button class="link" data-go="attendance">Back to attendance list</button></p></div>${nav()}${message()}`}
function checkout(){const rows=state.attendance.filter(r=>r.status==='checked_in');return`<div class="page">${header()}<h1>Manage check-outs</h1><p class="sub">Employees currently checked in at ${state.location?.name.split(' - ')[1]||''}.</p><div class="hero"><small>STILL CHECKED IN</small><strong>${rows.length}</strong> <span>${plural(rows.length,'employee')}</span></div><input class="search" id="outSearch" placeholder="Search checked-in employees">${rows.map(r=>`<div class="person"><span class="initials">${initials(r.name)}</span><span><strong>${r.name}</strong><small>In: ${fmtTime(r.check_in)}</small></span><button class="outlineBtn" data-checkout="${r.employee_id}">Check out</button></div>`).join('')||'<p class="muted small">No checked-in employees remain.</p>'}<p style="text-align:center;margin-top:18px"><button class="link" data-go="attendance">View attendance list</button></p></div>${nav()}${message()}`}
async function dashboard(){if(!state.dashboard)state.dashboard=await api('/api/dashboard');const d=state.dashboard;return`<div class="page">${header()}<h1>Attendance overview</h1><p class="sub">Today's summary across all assigned locations.</p><div class="grid2"><div class="dashStat"><strong>${d.employees}</strong><span>Employees</span></div><div class="dashStat"><strong style="color:var(--green)">${d.checked_in}</strong><span>Checked in</span></div><div class="dashStat"><strong>${d.completed}</strong><span>Completed</span></div><div class="dashStat"><strong style="color:var(--amber)">${d.not_checked_in}</strong><span>Not checked in</span></div></div><h2 class="sectionTitle">Location breakdown</h2>${d.locations.map(l=>`<div class="card listCard"><span><strong>${l.name.split(' - ')[1]||l.name}</strong><small>${plural(l.assigned_count,'employee')}</small></span><span style="text-align:right"><span class="badge green">${l.today.checked_in} checked in</span><small>${l.today.completed} completed</small></span></div>`).join('')}<h2 class="sectionTitle">Quick actions</h2><button class="primary" data-go="reports">View attendance report</button></div>${nav()}${message()}`}
function menu(){return`<div class="navPanel">${header()}<h1>Navigation</h1><p class="sub">${state.user?.name||''} · ${state.location?.name.split(' - ')[1]||'All locations'}</p>${[['dashboard','Dashboard','Overview of all locations'],['attendance','Mark attendance','Record employee check-ins'],['checkout','Manage check-outs','Close checked-in shifts'],['locations','Locations','Choose a branch'],['employees','Employees','Employee directory'],['reports','Reports','Attendance summaries'],['settings','Settings','Account and access']].map(([s,t,d])=>`<button class="navLink" data-go="${s}"><span><strong>${t}</strong><small>${d}</small></span><span>›</span></button>`).join('')}<button class="secondary" id="logout" style="margin-top:20px">Sign out</button></div>${message()}`}
function employees(){const shown=state.employees.filter(e=>!state.employeeQuery||(e.name+' '+e.id+' '+e.role).toLowerCase().includes(state.employeeQuery.toLowerCase()));const form=state.showEmployeeForm?`<div class="card addCard"><strong>Add employee</strong><p>Create an employee record for one of your locations.</p>${state.locations.length?`<form id="employeeForm"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Location</label><select name="location_id" required>${state.locations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></div><button class="secondary">Save employee</button></form>`:'<p class="muted small">Add a location before adding employees.</p><button class="secondary" data-go="locations">Open locations</button>'}</div>`:'';return`<div class="page">${header()}<h1>Employees</h1><p class="sub">Browse and manage people assigned to your locations.</p>${[['directory','Employee directory',plural(state.employees.length,'employee')+' · Search by name or ID'],['add','Add employee','Create a new employee record'],['import','Import employees','Upload a CSV staff list']].map(([k,t,d])=>`<button class="navLink" data-emp="${k}"><span><strong>${t}</strong><small>${d}</small></span><span>›</span></button>`).join('')}<input type="file" id="importFile" accept=".csv,text/csv" style="display:none">${form}<input class="search" id="empSearch" placeholder="Search name, role or employee ID" value="${state.employeeQuery}"><div id="directoryList">${shown.map(e=>`<div class="person"><span class="initials">${initials(e.name)}</span><span><strong>${e.name}</strong><small>${e.id} · ${e.role}</small></span></div>`).join('')||'<p class="muted small">No employees match.</p>'}</div></div>${nav()}${message()}`}
async function reports(){if(!state.history.length)state.history=await api('/api/reports/months?months=6');const h=state.history;const report=state.monthly;const locOptions=state.locations.map(l=>`<option value="${l.id}" ${state.reportLocation===l.id?'selected':''}>${l.name.split(' - ')[1]||l.name}</option>`).join('');return`<div class="page">${header()}<h1>Attendance reports</h1><p class="sub">Review attendance summaries by date and location.</p>${[['daily','Daily report','Check-in, check-out and hours'],['locations','Location report','Compare all assigned branches'],['export','Export report','Download attendance data']].map(([k,t,d])=>`<button class="navLink" data-report="${k}"><span><strong>${t}</strong><small>${d}</small></span><span>›</span></button>`).join('')}${report?`<h2 class="sectionTitle">${report.title}</h2><form id="reportFilters" class="card" style="padding:14px;margin-bottom:12px"><div class="field"><label>${state.reportMode==='daily'?'Date':'Month'}</label><input name="period" type="${state.reportMode==='daily'?'date':'month'}" value="${state.reportMode==='daily'?state.reportDate:state.reportMonth}" required></div><div class="field"><label>Location</label><select name="location_id">${state.reportMode==='locations'?'<option value="">All assigned locations</option>':''}${locOptions}</select></div><button class="secondary">Apply filters</button></form><div class="card" style="padding:8px 14px"><div class="reportRow employee head"><span>Date</span><span>Employee</span><span>In</span><span>Out</span><span>Hours</span></div>${report.rows.slice(0,50).map(r=>`<div class="reportRow employee"><span>${r.day.slice(5)}</span><span><strong>${r.employee_name}</strong><br><small class="muted">${r.employee_id} · ${(r.location_name.split(' - ')[1]||r.location_name)} · ${r.status.replace('_',' ')}</small></span><span>${r.check_in?fmtTime(r.check_in):'-'}</span><span>${r.check_out?fmtTime(r.check_out):'-'}</span><span>${r.hours??'-'}</span></div>`).join('')||'<p class="muted small" style="padding:10px 4px">No records match these filters.</p>'}</div>`:''}<h2 class="sectionTitle">Last 6 months</h2><div class="card" style="padding:8px 14px"><div class="reportRow head"><span>Month</span><span>Records</span><span>Done</span><span>Export</span></div>${h.map(m=>`<div class="reportRow"><span>${fmtMonth(new Date(m.month+'-01'))}</span><span>${m.total_records}</span><span>${m.completed}</span><span><button class="link" data-export="${m.month}">CSV</button></span></div>`).join('')}</div><p class="helper">Sample history is fictional and marked in the source field.</p></div>${nav()}${message()}`}
function settings(){const d=state.settings;const accessCount=d?d.access.length:null;let panel='';if(d&&state.settingsView==='profile')panel=`<div class="card" style="padding:16px;margin:12px 0"><h2 class="sectionTitle" style="margin-top:0">My profile</h2><form id="profileForm"><div class="field"><label>Name</label><input name="name" value="${d.profile.name}" required></div><div class="field"><label>User ID</label><input value="${d.profile.id}" disabled></div><button class="secondary">Save profile</button></form></div>`;if(d&&state.settingsView==='locations')panel=`<div class="card" style="padding:16px;margin:12px 0"><h2 class="sectionTitle" style="margin-top:0">Locations</h2>${d.locations.map(l=>`<div class="person"><span><strong>${l.name}</strong><small>${l.area} · ${plural(l.assigned_count,'employee')}</small></span></div>`).join('')||'<p class="muted small">No locations yet. Add the first branch below.</p>'}${state.user.role==='admin'?`<form id="locationForm" style="margin-top:14px"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Area</label><input name="area" required></div><button class="secondary">Add location</button></form>`:'<p class="muted small">Supervisors can view assigned locations. Admins manage branches.</p>'}</div>`;if(d&&state.settingsView==='access')panel=`<div class="card" style="padding:16px;margin:12px 0"><h2 class="sectionTitle" style="margin-top:0">User access</h2>${d.access.map(u=>`<div class="person"><span><strong>${u.name}</strong><small>${u.id} · ${u.role} · ${u.role==='admin'?'All locations':u.location_ids.join(', ')||'No locations'}</small></span></div>`).join('')}${state.user.role==='admin'?`<form id="accessForm" style="margin-top:14px"><div class="field"><label>User ID</label><input name="id" required></div><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Temporary password (12+ characters)</label><input name="password" type="password" required></div><div class="field"><label>Locations</label><select name="location_ids" multiple size="3">${d.locations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></div><button class="secondary">Create supervisor</button></form>`:'<p class="muted small">Only admins can create or change access.</p>'}</div>`;return`<div class="page">${header()}<h1>Settings</h1><p class="sub">Manage your account and app preferences.</p>${[['profile','My profile',(d?d.profile.name:state.user?.name)+' · '+(d?d.profile.id:state.user?.id)],['locations','Locations','View assigned branches and admin controls'],['access','User access','View roles and location scope']].map(([k,t,sub])=>`<button class="navLink" data-settings="${k}"><span><strong>${t}</strong><small>${sub}</small></span><span class="badge ${state.settingsView===k?'green':'blue'}">${k==='locations'?(d?d.locations.length:state.locations.length):k==='access'?(d?plural(accessCount,'user'):'›'):'›'}</span></button>`).join('')}${panel}<button class="secondary" id="logout" style="margin-top:18px">Sign out</button></div>${nav()}${message()}`}
async function render(){
 let html='';
 try{
  if(!state.token)html=login();
  else if(state.screen==='locations')html=locations();
  else if(state.screen==='attendance')html=attendance();
  else if(state.screen==='add')html=add();
  else if(state.screen==='confirmed')html=confirmed();
  else if(state.screen==='checkout')html=checkout();
  else if(state.screen==='dashboard'||state.screen==='home')html=await dashboard();
  else if(state.screen==='menu')html=menu();
  else if(state.screen==='employees')html=employees();
  else if(state.screen==='reports')html=await reports();
  else if(state.screen==='settings')html=settings();
  else html=locations();
 }catch(e){state.error=e.message;html=state.token?locations():login()}
 $app.innerHTML=html;bind();
}
function bind(){
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;loadAttendance()});
 const lf=document.getElementById('loginForm');if(lf)lf.onsubmit=doLogin;
 document.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{state.location=state.locations.find(l=>l.id===b.dataset.loc);render()});
 const cl=document.getElementById('continueLoc');if(cl)cl.onclick=async()=>{await loadAttendance();go(state.user.role==='admin'?'dashboard':'attendance')};
 const as=document.getElementById('attSearch');if(as)as.oninput=e=>{state.query=e.target.value;clearTimeout(window.q);window.q=setTimeout(loadAttendance,250)};
 const ls=document.getElementById('locSearch');if(ls)ls.oninput=e=>{state.locationQuery=e.target.value;render()};
 const es=document.getElementById('empSearch');if(es)es.oninput=e=>{state.employeeQuery=e.target.value;render()};
 document.querySelectorAll('[data-locaction]').forEach(b=>b.onclick=()=>{if(b.dataset.locaction==='add'){state.showLocationForm=!state.showLocationForm;render()}else if(b.dataset.locaction==='directory')document.getElementById('locationList')?.scrollIntoView({behavior:'smooth'});else document.getElementById('importLocationFile')?.click()});
 const lif=document.getElementById('importLocationFile');if(lif)lif.onchange=e=>e.target.files[0]&&importLocations(e.target.files[0]);
 const ads=document.getElementById('addSearch');if(ads)ads.oninput=e=>{state.addQuery=e.target.value;render()};
 document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{state.selected=state.attendance.find(r=>r.employee_id===b.dataset.select);render()});
 const dc=document.getElementById('doCheckin');if(dc)dc.onclick=doCheckin;
 document.querySelectorAll('[data-checkout]').forEach(b=>b.onclick=()=>doCheckout(b.dataset.checkout));
 const tn=document.getElementById('toggleNew');if(tn)tn.onclick=()=>{document.getElementById('newEmployee').style.display='block'};
 const ne=document.getElementById('newEmployee');if(ne)ne.onsubmit=doNewEmployee;
 const fp=document.getElementById('forgot');if(fp)fp.onclick=()=>toast('Demo: use the visible demo credentials. Production recovery needs an admin reset.');
 const imp=document.getElementById('importFile');if(imp)imp.onchange=e=>e.target.files[0]&&importEmployees(e.target.files[0]);
 const lo=document.getElementById('logout');if(lo)lo.onclick=logout;
 document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportMonth(b.dataset.export));
 document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>openReport(b.dataset.report));
 document.querySelectorAll('[data-emp]').forEach(b=>b.onclick=()=>{if(b.dataset.emp==='add'){state.showEmployeeForm=!state.showEmployeeForm;render()}else if(b.dataset.emp==='directory')document.getElementById('directoryList')?.scrollIntoView({behavior:'smooth'});else document.getElementById('importFile')?.click()});
 const rf=document.getElementById('reportFilters');if(rf)rf.onsubmit=applyReportFilters;
 document.querySelectorAll('[data-settings]').forEach(b=>b.onclick=()=>openSettings(b.dataset.settings));
 const pf=document.getElementById('profileForm');if(pf)pf.onsubmit=saveProfile;
 const locf=document.getElementById('locationForm');if(locf)locf.onsubmit=createLocation;
 const ef=document.getElementById('employeeForm');if(ef)ef.onsubmit=createEmployee;
 const acf=document.getElementById('accessForm');if(acf)acf.onsubmit=createAccess;
}
const appScreens=['locations','attendance','add','confirmed','checkout','dashboard','menu','employees','reports','settings'];
function historyPayload(){return{gfScreen:state.screen,settingsView:state.settingsView||''}}
function currentHash(){return'#'+state.screen}
function pushCurrent(replace=false){const payload=historyPayload();const current=history.state&&!history.state.gfBase?{gfScreen:history.state.gfScreen,settingsView:history.state.settingsView||''}:null;if(replace)history.replaceState(payload,'',currentHash());else if(!current||JSON.stringify(current)!==JSON.stringify(payload)||location.hash!==currentHash())history.pushState(payload,'',currentHash())}
function startHistory(screen){history.replaceState({gfBase:true},'','#guardian');history.pushState({gfScreen:screen,settingsView:state.settingsView||''},'','#'+screen)}
function go(screen,opts={}){state.error='';state.notice='';if(screen==='home')screen=state.user?.role==='admin'?'dashboard':'attendance';if(screen==='settings'&&!state.settings){openSettings(state.settingsView||'');return}state.screen=screen;if(opts.settingsView!==undefined)state.settingsView=opts.settingsView;if(['attendance','add','checkout'].includes(screen)&&!state.location){state.screen='locations';if(!opts.fromPop)pushCurrent();render();return}if(!opts.fromPop)pushCurrent(opts.replace);if(['attendance','add','checkout'].includes(screen)){loadAttendance().then(render);return}if(screen==='employees'){loadEmployees();return}render()}
window.addEventListener('popstate',event=>{if(!state.token){state.screen='login';render();return}if(event.state?.gfBase){history.pushState(historyPayload(),'',currentHash());render();return}const target=event.state?.gfScreen||location.hash.slice(1);if(!appScreens.includes(target)){history.pushState(historyPayload(),'',currentHash());render();return}go(target,{fromPop:true,settingsView:event.state?.settingsView||''})});
async function doLogin(e){e.preventDefault();state.error='';const f=new FormData(e.target);try{const r=await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});state.token=r.token;state.user=r.user;localStorage.setItem('gf_token',r.token);localStorage.setItem('gf_user',JSON.stringify(r.user));await bootstrap();state.notice='';state.screen='locations';startHistory('locations');render()}catch(err){if(!state.localMode){state.localMode=true;try{const r=await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});state.token=r.token;state.user=r.user;localStorage.setItem('gf_token',r.token);localStorage.setItem('gf_user',JSON.stringify(r.user));await bootstrap();state.notice='';state.screen='locations';startHistory('locations');render();return}catch(e2){state.localMode=false}}state.error=err.message;render()}}
async function bootstrap(){state.locations=await api('/api/locations');state.location=state.locations.some(l=>l.id===state.location?.id)?state.location:state.locations[0];state.showLocationForm=!state.locations.length&&state.user?.role==='admin';state.dashboard=null;state.history=[]}
async function loadAttendance(){if(!state.location)return;const q=new URLSearchParams({location_id:state.location.id,day:todayISO()});if(state.query)q.set('q',state.query);if(state.filter!=='all')q.set('status',state.filter);const r=await api('/api/attendance?'+q);state.attendance=r.rows;state.summary=r.summary;render()}
async function loadEmployees(renderNow=true){state.employees=await api('/api/employees');if(renderNow)render()}
async function doCheckin(){try{state.lastCheck=await api('/api/attendance/checkin',{method:'POST',body:JSON.stringify({employee_id:state.selected.employee_id,location_id:state.location.id})});state.selected=null;state.dashboard=null;await loadAttendance();go('confirmed')}catch(e){state.error=e.message;render()}}
async function doCheckout(id){try{await api('/api/attendance/checkout',{method:'POST',body:JSON.stringify({employee_id:id,location_id:state.location.id})});state.dashboard=null;await loadAttendance();state.screen='checkout';toast('Check-out recorded')}catch(e){state.error=e.message;render()}}
async function doNewEmployee(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{await api('/api/employees',{method:'POST',body:JSON.stringify({...f,location_id:state.location.id})});state.employees=[];state.locations=await api('/api/locations');state.dashboard=null;await loadAttendance();toast('Employee added')}catch(err){state.error=err.message;render()}}
async function createEmployee(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{await api('/api/employees',{method:'POST',body:JSON.stringify({...f,role:'Guard'})});state.locations=await api('/api/locations');state.dashboard=null;await loadEmployees(false);state.showEmployeeForm=false;toast('Employee added')}catch(err){state.error=err.message;render()}}
async function openReport(kind){const month=todayISO().slice(0,7);if(kind==='export'){exportMonth(month);return}state.reportMode=kind;state.reportDate=todayISO();state.reportMonth=month;state.reportLocation=kind==='daily'?(state.location?.id||state.locations[0]?.id||''):'';await loadReport()}
async function loadReport(){try{const q=new URLSearchParams({month:state.reportMonth});if(state.reportMode==='daily')q.set('day',state.reportDate);if(state.reportLocation)q.set('location_id',state.reportLocation);const r=await api('/api/reports/monthly?'+q);state.monthly={title:state.reportMode==='daily'?'Daily report · '+fmtDate(new Date(state.reportDate+'T00:00:00')):'Location report · '+fmtMonth(new Date(state.reportMonth+'-01')),rows:r.rows};render()}catch(e){state.error=e.message;render()}}
async function applyReportFilters(e){e.preventDefault();const f=new FormData(e.target);if(state.reportMode==='daily'){state.reportDate=f.get('period');state.reportMonth=String(f.get('period')).slice(0,7)}else{state.reportMonth=f.get('period');state.reportDate=''}state.reportLocation=f.get('location_id')||'';await loadReport()}
async function openSettings(kind){try{state.settings=await api('/api/settings');go('settings',{settingsView:kind})}catch(e){state.error=e.message;render()}}
async function saveProfile(e){e.preventDefault();try{const body=Object.fromEntries(new FormData(e.target));const r=await api('/api/settings/profile',{method:'PATCH',body:JSON.stringify(body)});state.user={...state.user,name:r.name};localStorage.setItem('gf_user',JSON.stringify(state.user));state.settings=await api('/api/settings');toast('Profile saved')}catch(e){state.error=e.message;render()}}
async function createLocation(e){e.preventDefault();try{const body=Object.fromEntries(new FormData(e.target));body.id=newLocationId(body.name);await api('/api/settings/locations',{method:'POST',body:JSON.stringify({...body,assigned_count:0})});state.locations=await api('/api/locations');state.location=state.locations.find(l=>l.id===body.id)||state.location;state.showLocationForm=false;state.dashboard=null;state.settings=await api('/api/settings');toast('Location added as '+body.id)}catch(e){state.error=e.message;render()}}
async function importLocations(file){try{const text=await file.text();const lines=text.trim().split(/\r?\n/).filter(Boolean);if(lines.length<2)throw new Error('CSV needs a header and at least one row');const headers=lines[0].split(',').map(x=>x.trim());const rows=lines.slice(1).map(line=>{const cells=line.split(',').map(x=>x.trim());const row=Object.fromEntries(headers.map((h,i)=>[h,cells[i]||'']));return{id:row.id||null,name:row.name,area:row.area,assigned_count:Number(row.assigned_count||0)}});const r=await api('/api/settings/locations/import',{method:'POST',body:JSON.stringify({rows})});state.locations=await api('/api/locations');state.location=state.location||state.locations[0];state.settings=await api('/api/settings');toast('Imported '+r.created+' new and updated '+r.updated+' locations')}catch(e){state.error=e.message;render()}}
async function createAccess(e){e.preventDefault();try{const f=new FormData(e.target);const body={id:f.get('id'),name:f.get('name'),password:f.get('password'),role:'supervisor',location_ids:f.getAll('location_ids')};await api('/api/settings/access',{method:'POST',body:JSON.stringify(body)});state.settings=await api('/api/settings');toast('Supervisor access created')}catch(e){state.error=e.message;render()}}
async function exportMonth(month){if(state.localMode){toast('CSV export needs the backend connection');return}try{const r=await fetch(API+'/api/reports/export.csv?month='+encodeURIComponent(month),{headers:{Authorization:'Bearer '+state.token}});if(!r.ok){let message='CSV export failed';try{message=(await r.json()).detail||message}catch{}throw new Error(message)}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='guardian-attendance-'+month+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('CSV downloaded')}catch(e){state.error=e.message;render()}}
async function importEmployees(file){try{const text=await file.text();const lines=text.trim().split(/\r?\n/).filter(Boolean);if(lines.length<2)throw new Error('CSV needs a header and at least one row');const headers=lines[0].split(',').map(x=>x.trim());const rows=lines.slice(1).map(line=>{const cells=line.split(',').map(x=>x.trim());const row=Object.fromEntries(headers.map((h,i)=>[h,cells[i]||'']));return{id:row.id||null,name:row.name,phone:row.phone,role:row.role||'Guard',location_id:row.location_id||state.location?.id}});const r=await api('/api/employees/import',{method:'POST',body:JSON.stringify({rows})});state.employees=[];state.locations=await api('/api/locations');state.dashboard=null;await loadEmployees(false);toast('Imported '+r.created+' new and updated '+r.updated+' employees')}catch(e){state.error=e.message;render()}}
function logout(){localStorage.removeItem('gf_token');localStorage.removeItem('gf_user');state.token='';state.user=null;state.screen='login';state.localMode=false;state.localDB=null;history.replaceState({gfScreen:'login'},'','#login');render()}
(async()=>{if(state.token){try{await bootstrap();const requested=location.hash.slice(1);state.screen=appScreens.includes(requested)?requested:'locations';startHistory(state.screen)}catch{localStorage.removeItem('gf_token');state.token='';state.screen='login';history.replaceState({gfScreen:'login'},'','#login')}}else history.replaceState({gfScreen:'login'},'','#login');render()})();
</script>
</body>
