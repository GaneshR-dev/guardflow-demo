.logo-wrap:before{transform:translateY(4px)}.logo-mark{width:184px;height:184px;transform:translate(8px,14px)}.login-title{position:relative;z-index:2}.login-screen .primary-btn{height:58px}.primary-btn,.outline-btn{height:58px}.location-list+.primary-btn{height:72px}.map-art{margin-top:-27px}.confirm-actions{margin-top:28px;gap:12px}.confirm-actions .primary-btn,.confirm-actions .outline-btn{height:54px}.add-hero .primary-btn,.add-hero .outline-btn{height:56px}.status-panel{padding:3px 20px 8px}.status-panel h2{margin-top:21px}.status-panel .divider-line{margin-top:17px}.status-panel+.summary-card{padding-top:10px;padding-bottom:10px;margin-top:8px}
/* pass 2 measured today alignment */.today-card{background:#eef4ff;margin:-24px 0 12px;padding:12px}.today-heading{margin-bottom:18px}.today-row{background:#fff;border:0;border-radius:12px;min-height:74px;padding:10px 12px;margin:0 0 18px;grid-template-columns:42px 1fr auto}.today-row:last-child{margin-bottom:0}.today-row .row-status svg{width:23px;height:23px}

<body>
<div class="stage"><div class="phone"><div class="statusbar" aria-hidden="true"><span id="statusTime">9:41</span><span class="status-icons"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg><svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7a6.3 6.3 0 0 1 8 0"/><path d="M7 9.5h2"/></svg><span class="battery"></span></span></div><main id="app" aria-live="polite"></main></div></div>
<script>
(function(){
const locations=[{id:'hsr',name:'Bangalore - HSR',address:'123, HSR Layout'},{id:'kora',name:'Bangalore - Koramangala',address:'456, Koramangala'},{id:'white',name:'Bangalore - Whitefield',address:'789, Whitefield'},{id:'omr',name:'Chennai - OMR',address:'101, OMR Road'}];
const employees=[{id:'EMP001',name:'Deepak Sivadas',initials:'DS'},{id:'EMP002',name:'Ananya Krishna',initials:'AK'},{id:'EMP003',name:'Rohan Kumar',initials:'RK'},{id:'EMP004',name:'Sneha Patil',initials:'SP'}];
const params=new URLSearchParams(location.search);
const state={screen:params.get('screen')||'login',locationId:'hsr',employeeId:'EMP001',search:'',data:load()};
const app=document.getElementById('app'),statusTime=document.getElementById('statusTime');
function pad(n){return String(n).padStart(2,'0')}
function clockTime(d){let h=d.getHours(),m=pad(d.getMinutes()),ap=h>=12?'PM':'AM';h=h%12||12;return pad(h)+':'+m+' '+ap}
function shortTime(d){return clockTime(d)}
function statusClock(d){let h=d.getHours();h=h%12||12;return h+':'+pad(d.getMinutes())}
function dateLine(d){return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+', '+d.toLocaleDateString('en-GB',{weekday:'short'})}
function dateOnly(d){return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function dayName(d){return d.toLocaleDateString('en-GB',{weekday:'short'})}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nowIso(){return new Date().toISOString()}
function parseTime(iso){return iso?new Date(iso):null}
function load(){try{return JSON.parse(localStorage.getItem('reference-attendance-flow-v1')||'{}')}catch(e){return{}}}
function save(){localStorage.setItem('reference-attendance-flow-v1',JSON.stringify(state.data))}
function currentLocation(){return locations.find(x=>x.id===state.locationId)||locations[0]}
function currentEmployee(){return employees.find(x=>x.id===state.employeeId)||employees[0]}
function records(){const key=state.locationId+':'+todayKey();if(!state.data[key])state.data[key]={};return state.data[key]}
function recordFor(id){return records()[id]||null}
function openRecords(){return employees.map(e=>({employee:e,record:recordFor(e.id)})).filter(x=>x.record&&x.record.in&&!x.record.out)}
function checkedRecords(){return employees.map(e=>({employee:e,record:recordFor(e.id)})).filter(x=>x.record&&x.record.in)}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function icon(name){const common='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';const icons={
user:'<svg viewBox="0 0 24 24" '+common+'><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>',
lock:'<svg viewBox="0 0 24 24" '+common+'><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
eyeOff:'<svg viewBox="0 0 24 24" '+common+'><path d="M3 3l18 18"/><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c7 0 10 7 10 7a17 17 0 0 1-2.2 3.1M6.6 6.6A16 16 0 0 0 2 12s3 7 10 7a9.5 9.5 0 0 0 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
back:'<svg viewBox="0 0 24 24" '+common+'><path d="M15 18l-6-6 6-6"/></svg>',
menu:'<svg viewBox="0 0 24 24" '+common+'><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
logout:'<svg viewBox="0 0 24 24" '+common+'><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>',
pin:'<svg viewBox="0 0 24 24" '+common+'><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
pinSolid:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a8 8 0 0 0-8 8c0 6 8 12 8 12s8-6 8-12a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>',
building:'<svg class="building" viewBox="0 0 24 24" '+common+'><path d="M3 21h18"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M10 7h1M10 11h1M10 15h1M14 7h1M14 11h1M14 15h1"/></svg>',
search:'<svg viewBox="0 0 24 24" '+common+'><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
chevron:'<svg class="chevron" viewBox="0 0 24 24" '+common+'><path d="M9 18l6-6-6-6"/></svg>',
check:'<svg viewBox="0 0 24 24" '+common+'><path d="M20 6L9 17l-5-5"/></svg>',
clock:'<svg viewBox="0 0 24 24" '+common+'><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
calendar:'<svg viewBox="0 0 24 24" '+common+'><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
plus:'<svg viewBox="0 0 24 24" '+common+'><path d="M12 5v14M5 12h14"/></svg>',
plusCircle:'<svg viewBox="0 0 24 24" '+common+'><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
userSolid:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg>',
checkCircle:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M7.5 12.2l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
users:'<svg viewBox="0 0 64 48" fill="currentColor"><circle cx="32" cy="17" r="10"/><path d="M17 47c1-11 7-18 15-18s14 7 15 18H17z"/><circle cx="14" cy="21" r="7" opacity=".75"/><path d="M2 47c1-9 5-14 11-15 2 3 5 5 8 6-4 2-6 5-7 9H2z" opacity=".75"/><circle cx="50" cy="21" r="7" opacity=".75"/><path d="M62 47c-1-9-5-14-11-15-2 3-5 5-8 6 4 2 6 5 7 9h12z" opacity=".75"/></svg>',
info:'<svg viewBox="0 0 24 24" '+common+'><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>'};return icons[name]||''}
function logoMark(){return '<svg class="logo-mark" viewBox="0 0 200 200" fill="none"><path d="M45 45h105a13 13 0 0 1 13 13v74a13 13 0 0 1-13 13H45a13 13 0 0 1-13-13V58a13 13 0 0 1 13-13z" stroke="#0f66c7" stroke-width="8"/><path d="M45 45h105a13 13 0 0 1 13 13v18H32V58a13 13 0 0 1 13-13z" fill="#0f66c7"/><path d="M73 27v32M122 27v32" stroke="#0f66c7" stroke-width="8" stroke-linecap="round"/><path d="M73 43v16M122 43v16" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="56" y="91" width="16" height="16" rx="3" fill="#8ebdf3"/><rect x="88" y="91" width="16" height="16" rx="3" fill="#8ebdf3"/><rect x="120" y="91" width="16" height="16" rx="3" fill="#8ebdf3"/><rect x="56" y="118" width="16" height="16" rx="3" fill="#8ebdf3"/><circle cx="134" cy="129" r="43" fill="#fbfcff" stroke="#0f66c7" stroke-width="8"/><path d="M134 108v24l15 11" stroke="#0f66c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function mapArt(){return '<svg class="map-art" viewBox="0 0 220 170" fill="none"><g><path d="M14 105L48 82L91 91L86 151L50 151L23 137Z" fill="#dceafd"/><path d="M48 82L91 91L119 119L86 151Z" fill="#d3e5fb"/><path d="M91 91L153 69L192 83L199 128L153 150L119 119Z" fill="#e1edfe"/><path d="M48 82L50 151M91 91L86 151M119 119L199 128M23 137L119 119L153 69M14 105L91 91" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(30.8 28.2) scale(.72 .76)"><path d="M110 7c-25 0-43 18-43 41 0 31 43 70 43 70s43-39 43-70c0-23-18-41-43-41z" fill="#0f66c7"/><circle cx="110" cy="47" r="15" fill="#fff"/></g></svg>'}
function checkArt(type){if(type==='halo')return '<svg class="check-art halo" viewBox="0 0 140 140" fill="none"><circle cx="70" cy="70" r="68" fill="#ddf7eb"/><circle cx="70" cy="70" r="55" fill="#c8f2df"/><circle cx="70" cy="70" r="47" fill="#21c77b"/><path d="M52 71l13 13 25-27" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>';return '<svg class="check-art rays" viewBox="0 0 130 105" fill="none"><path d="M31 25l9 9M99 25l-9 9M18 57h13M99 57h13" stroke="#35cf91" stroke-width="6" stroke-linecap="round"/><circle cx="65" cy="57" r="36" fill="#21c77b"/><path d="M48 58l12 12 24-26" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function usersAdd(){return '<svg viewBox="0 0 150 105" fill="#0f66c7"><circle cx="72" cy="23" r="20"/><path d="M35 87c3-27 17-42 37-42s34 15 37 42H35z"/><circle cx="31" cy="34" r="14" opacity=".9"/><path d="M5 87c2-20 11-32 25-35 4 6 10 10 17 12-8 5-13 13-15 23H5z" opacity=".9"/><circle cx="113" cy="34" r="14" opacity=".9"/><path d="M139 87c-2-20-11-32-25-35-4 6-10 10-17 12 8 5 13 13 15 23h27z" opacity=".9"/><circle cx="116" cy="69" r="23" fill="#0f66c7" stroke="#fbfcff" stroke-width="6"/><path d="M116 57v24M104 69h24" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>'}
function waves(){return '<div class="waves"><svg viewBox="0 0 390 112" preserveAspectRatio="none"><path d="M0 40C60 4 102 21 151 48c55 30 96 33 142 8 38-21 68-20 97 1v55H0V40z" fill="#e1efff"/><path d="M0 59c51-23 95-11 139 13 53 28 103 27 151 2 39-20 70-17 100 2v36H0V59z" fill="#cde3fb"/><path d="M0 75c60-18 104-3 151 15 49 19 91 12 135-6 39-16 73-10 104 8v7H0V85z" fill="#b9d8f7" opacity=".75"/></svg></div>'}
function header(title,left,right){return '<div class="topbar"><div>'+(left||'')+'</div><h1>'+title+'</h1><div>'+(right||'')+'</div></div>'}
function iconButton(name,label,action){return '<button class="icon-btn" type="button" aria-label="'+label+'" data-action="'+action+'">'+icon(name)+'</button>'}
function locationCard(loc){const selected=loc.id===state.locationId?' selected':'';return '<button type="button" class="location-card'+selected+'" data-location="'+loc.id+'">'+icon('building')+'<span><strong>'+loc.name+'</strong><span>'+loc.address+'</span></span><span class="radio"></span></button>'}
function employeeRow(emp){const rec=recordFor(emp.id);let right=icon('chevron');if(rec&&rec.in&&!rec.out)right='<span class="row-status">'+icon('check')+'<span>Checked In<br>'+shortTime(parseTime(rec.in))+'</span></span>';if(rec&&rec.out)right='<span class="row-status">'+icon('check')+'<span>Checked Out<br>'+shortTime(parseTime(rec.out))+'</span></span>';return '<button type="button" class="employee-row" data-employee="'+emp.id+'"><span class="avatar">'+emp.initials+'</span><span><strong>'+emp.name+'</strong><small>'+emp.id+'</small></span>'+right+'</button>'}
function profileCard(emp,variant){return '<div class="profile-card '+(variant||'')+'"><span class="avatar profile-avatar">'+icon('userSolid')+'</span><span><strong>'+emp.name+'</strong><small>Emp ID: '+emp.id+'</small></span></div>'}
function summaryCard(rec,title){const checkIn=rec&&rec.in?clockTime(parseTime(rec.in)):'--';const checkOut=rec&&rec.out?clockTime(parseTime(rec.out)):'--';title=title||'Today\'s Attendance';return '<div class="summary-card"><div class="summary-title">'+icon('calendar')+title+'</div><div class="summary-grid"><div><small>Check In</small><strong>'+checkIn+'</strong></div><div><small>Check Out</small><strong>'+checkOut+'</strong></div></div></div>'}
function locationMini(){const loc=currentLocation();return '<div class="location-mini">'+icon('pinSolid')+'<span><small>Location</small><strong>'+loc.name+'</strong></span><button type="button" data-action="change-location">Change</button></div>'}
function renderLogin(){return '<section class="screen login-screen"><div class="logo-wrap">'+logoMark()+'</div><h1 class="login-title">Attendance</h1><p class="tagline">Track. Manage. Grow.</p><form style="display:contents" onsubmit="return false"><label class="field">'+icon('user')+'<input id="userId" autocomplete="username" placeholder="User ID"></label><label class="field">'+icon('lock')+'<input id="password" type="password" autocomplete="current-password" placeholder="Password"><span class="trailing">'+icon('eyeOff')+'</span></label></form><button class="primary-btn" type="button" data-action="login">Login</button><div class="divider">or</div><button class="link-btn" type="button">Forgot Password?</button>'+waves()+'</section>'}
function renderLocation(){return '<section class="screen">'+header('Select Location',iconButton('back','Back','login'))+mapArt()+'<h2 class="screen-title">Choose Your Location</h2><p class="screen-sub">Select the location to mark attendance</p><div class="location-list">'+locations.map(locationCard).join('')+'</div><button class="primary-btn" type="button" data-action="choose-location">Continue</button></section>'}
function renderSelectEmployee(){const loc=currentLocation(),d=new Date(),q=state.search.trim().toLowerCase();const list=employees.filter(e=>!q||e.name.toLowerCase().includes(q)||e.id.toLowerCase().includes(q));return '<section class="screen select-screen">'+header('Attendance',iconButton('menu','Today attendance','today'),iconButton('logout','Logout','login'))+'<div class="info-strip"><span class="left">'+icon('pin')+'<span>'+loc.name+'</span></span><span class="right">'+icon('calendar')+'<span>'+dateOnly(d)+'<small>'+dayName(d)+'</small></span></span></div><div class="select-panel"><div class="select-hero">'+icon('users')+'<h2>Select Employee</h2><p>Choose an employee to mark attendance</p></div><label class="field search-box">'+icon('search')+'<input id="employeeSearch" placeholder="Search employee..." value="'+esc(state.search)+'"></label></div><div class="employee-list">'+(list.length?list.map(employeeRow).join(''):'<div class="empty-state">No employee matches this search.</div>')+'</div></section>'}
function renderPreCheck(){const emp=currentEmployee();return '<section class="screen pre-screen">'+header('Attendance',iconButton('menu','Employee list','select'),iconButton('logout','Logout','login'))+profileCard(emp)+locationMini()+'<div class="pre-panel"><div class="detail-center">'+icon('clock').replace('<svg','<svg class="clock-hero"')+'<h2>Check In</h2><p>Mark your check-in time</p><button class="tap-card" type="button" data-action="checkin">'+icon('clock')+'Tap to Mark Check-In</button></div>'+summaryCard(recordFor(emp.id))+'</div></section>'}
function renderConfirm(){const emp=currentEmployee(),rec=recordFor(emp.id),t=rec&&rec.in?parseTime(rec.in):new Date();return '<section class="screen">'+header('Attendance',iconButton('back','Back','select'),'')+'<div class="confirm-top"><span class="avatar">'+emp.initials+'</span><strong>'+emp.name+'</strong><small>'+emp.id+'</small>'+checkArt('rays')+'<h2 class="status-title">Checked In</h2><div class="status-time">'+clockTime(t)+'</div><div class="status-date">'+dateLine(t)+'</div></div><div class="confirm-actions"><button class="outline-btn" type="button" data-action="add-another">'+icon('plusCircle')+'Add Another Employee</button><button class="primary-btn" type="button" data-action="go-checkout">Mark Check Out</button></div></section>'}
function renderAddAnother(){return '<section class="screen">'+header('Add Another Employee',iconButton('back','Back','confirm'),'')+'<div class="add-hero">'+usersAdd()+'<h2>Check-in Another Employee?</h2><p>You can add another employee before checking out.</p><button class="primary-btn" type="button" data-action="add-employee">Add Employee</button><div style="height:10px"></div><button class="outline-btn" type="button" data-action="go-checkout">Go to Check Out</button></div></section>'}
function todayRow(item){const rec=item.record,out=rec.out?'Checked Out':'Checked In',t=rec.out?parseTime(rec.out):parseTime(rec.in);return '<button type="button" class="today-row" data-status-employee="'+item.employee.id+'"><span class="avatar">'+item.employee.initials+'</span><span><strong>'+item.employee.name+'</strong></span><span class="row-status"><span>'+out+'<br>'+shortTime(t)+'</span>'+icon('checkCircle')+'</span></button>'}
function renderToday(){const list=checkedRecords(),open=openRecords(),n=open.length;return '<section class="screen">'+header('Attendance',iconButton('back','Back','select'),'')+'<div class="today-card"><div class="today-heading">Today\'s Attendance</div>'+(list.length?list.map(todayRow).join(''):'<div class="empty-state">No employee has checked in yet.</div>')+'</div><div class="checkout-panel"><div class="checkout-label">'+icon('clock')+'Check Out</div><p>Mark check-out time for all checked-in employees</p><button class="primary-btn" type="button" data-action="checkout-all" '+(n?'':'disabled')+'>'+icon('logout')+'Mark Check Out</button></div><div class="note-card">'+icon('info')+'<span>Check-out will be recorded for <strong>'+n+' employee'+(n===1?'':'s')+'</strong></span></div></section>'}
function renderStatus(){const emp=currentEmployee(),rec=recordFor(emp.id),now=new Date();return '<section class="screen">'+header('Attendance',iconButton('menu','Today attendance','today'),iconButton('logout','Logout','login'))+profileCard(emp,'large')+'<div class="status-panel"><div class="status-card-center">'+checkArt('halo')+'<h2>Check In</h2><div class="status-label">Current Time</div><div class="current-time">'+clockTime(now)+'</div><div class="status-date">'+dateLine(now)+'</div></div><div class="divider-line"></div><div class="checkout-line">'+icon('clock')+'Check Out</div><button class="primary-btn" type="button" data-action="checkout-one">Mark Check Out</button></div>'+summaryCard(rec,'Today\'s Summary')+'</section>'}
function renderComplete(){const d=new Date(),n=checkedRecords().filter(x=>x.record.out).length;return '<section class="screen">'+header('Attendance',iconButton('back','Back','today'),'')+'<div class="complete-screen">'+checkArt('rays')+'<h2>Checked Out</h2><div class="time">'+clockTime(d)+'</div><p>'+dateLine(d)+'<br>'+n+' employee record'+(n===1?'':'s')+' updated.</p><button class="primary-btn" type="button" data-action="select">Back to Attendance</button><div style="height:10px"></div><button class="outline-btn" type="button" data-action="login">Done</button></div></section>'}
function render(){statusTime.textContent=statusClock(new Date());const views={login:renderLogin,location:renderLocation,select:renderSelectEmployee,pre:renderPreCheck,confirm:renderConfirm,add:renderAddAnother,today:renderToday,status:renderStatus,complete:renderComplete};app.innerHTML=(views[state.screen]||renderLogin)();const search=document.getElementById('employeeSearch');if(search){search.addEventListener('input',e=>{state.search=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('employeeSearch');next.focus();next.setSelectionRange(pos,pos)})}}
function go(screen){state.screen=screen;render()}
function markCheckin(){const recs=records();if(recs[state.employeeId]&&recs[state.employeeId].in&&!recs[state.employeeId].out){go('status');return}recs[state.employeeId]={in:nowIso(),out:null};save();go('confirm')}
function checkoutOne(){const rec=recordFor(state.employeeId);if(rec&&rec.in&&!rec.out){rec.out=nowIso();save()}go('today')}
function checkoutAll(){const recs=records(),out=nowIso();Object.keys(recs).forEach(id=>{if(recs[id]&&recs[id].in&&!recs[id].out)recs[id].out=out});save();go('complete')}
app.addEventListener('click',event=>{const locBtn=event.target.closest('[data-location]');if(locBtn){state.locationId=locBtn.dataset.location;render();return}const empBtn=event.target.closest('[data-employee]');if(empBtn){state.employeeId=empBtn.dataset.employee;const rec=recordFor(state.employeeId);go(rec&&rec.in?'status':'pre');return}const statusBtn=event.target.closest('[data-status-employee]');if(statusBtn){state.employeeId=statusBtn.dataset.statusEmployee;go('status');return}const actionBtn=event.target.closest('[data-action]');if(!actionBtn)return;const action=actionBtn.dataset.action;
if(action==='login')go('location');if(action==='choose-location')go('select');if(action==='select')go('select');if(action==='today')go('today');if(action==='change-location')go('location');if(action==='checkin')markCheckin();if(action==='add-another')go('add');if(action==='add-employee')go('select');if(action==='go-checkout')go('today');if(action==='checkout-all')checkoutAll();if(action==='checkout-one')checkoutOne();if(action==='confirm')go('confirm')});
setInterval(()=>{statusTime.textContent=statusClock(new Date());if(state.screen==='status')render()},30000);render();
})();
</script>
</body>

<style>
