info:'<svg viewBox="0 0 24 24" '+common+'><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>'};return icons[name]||''}

function mapArt(){return '<svg class="map-art" viewBox="0 0 260 170" fill="none"><defs><linearGradient id="pinFill" x1="110" y1="7" x2="110" y2="118" gradientUnits="userSpaceOnUse"><stop stop-color="#2f83ec"/><stop offset="1" stop-color="#0d63c7"/></linearGradient></defs><path d="M31 35c5-9 15-13 24-9 5-8 18-8 23 1 8-1 14 3 17 10H28c0-1 1-2 3-2z" fill="#d8e7fa"/><path d="M211 23c6-10 18-14 28-9 5-8 18-8 24 1 9-1 16 4 19 12h-74c0-2 1-3 3-4z" fill="#d8e7fa"/><path d="M6 120h14v46H6z" fill="#c8dbf5"/><rect x="24" y="89" width="21" height="77" rx="3" fill="#a9c8ef"/><path d="M31 99h3v6h-3zm8 0h3v6h-3zm-8 13h3v6h-3zm8 0h3v6h-3zm-8 13h3v6h-3zm8 0h3v6h-3z" fill="#fff"/><rect x="50" y="107" width="17" height="59" rx="3" fill="#c0d7f3"/><path d="M56 119h3v6h-3zm6 0h3v6h-3zm-6 14h3v6h-3zm6 0h3v6h-3z" fill="#fff" opacity=".8"/><path d="M73 91c2-14 12-24 23-23 13 1 20 13 20 27l-12 71H82L70 108c0-6 1-12 3-17z" fill="#d7e7fa"/><path d="M147 91c4-24 17-42 32-42 16 0 27 19 31 45l12 72h-82l7-75z" fill="#d7e7fa"/><path d="M76 92c16-24 40-28 58-12l-28 86H81c-17-2-28-17-25-34l20-40z" fill="#dceafd"/><path d="M134 80l23-29c17 3 32 22 39 49 6 24-3 48-23 63l-67 3 28-86z" fill="#d5e5fa"/><path d="M62 130c29-20 55-37 82-58M82 166c20-38 39-73 58-109M105 166c33-30 63-57 94-82M153 166c10-34 22-67 38-101" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M69 76c7-8 18-8 24 1 6 9 3 21-6 27-9-5-17-11-18-28z" fill="#22bd8d"/><path d="M76 74c-2-10 4-18 13-19 8 7 9 18 3 27-7-1-13-3-16-8z" fill="#7ea7dc"/><path d="M188 143l17-33 17 33h-34z" fill="#22bd8d"/><rect x="207" y="77" width="21" height="89" rx="3" fill="#a9c8ef"/><path d="M214 88h3v6h-3zm8 0h3v6h-3zm-8 14h3v6h-3zm8 0h3v6h-3zm-8 14h3v6h-3zm8 0h3v6h-3zm-8 14h3v6h-3zm8 0h3v6h-3z" fill="#fff"/><rect x="233" y="99" width="18" height="67" rx="3" fill="#b9d1f0"/><path d="M239 112h3v7h-3zm7 0h3v7h-3zm-7 17h3v7h-3zm7 0h3v7h-3z" fill="#fff" opacity=".85"/><g transform="translate(96 5) scale(.68 .75)"><path d="M110 7c-25 0-43 18-43 41 0 31 43 70 43 70s43-39 43-70c0-23-18-41-43-41z" fill="url(#pinFill)"/><circle cx="110" cy="47" r="15" fill="#fff"/></g></svg>'}
function checkArt(type){if(type==='halo')return '<svg class="check-art halo" viewBox="0 0 140 140" fill="none"><circle cx="70" cy="70" r="68" fill="#ddf7eb"/><circle cx="70" cy="70" r="60" fill="#c8f2df"/><circle cx="70" cy="70" r="50" fill="#22b77e"/><path d="M51 71l13 13 26-28" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>';return '<svg class="check-art rays" viewBox="0 0 130 105" fill="none"><path d="M27 20l7 7M103 20l-7 7M12 55l10 2M118 55l-10 2" stroke="#35cf91" stroke-width="5.5" stroke-linecap="round"/><circle cx="65" cy="57" r="36" fill="#22b77e"/><path d="M48 58l12 12 24-26" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function usersAdd(){return '<svg viewBox="0 0 150 105" fill="#0f66c7"><circle cx="72" cy="23" r="20"/><path d="M35 87c3-27 17-42 37-42s34 15 37 42H35z"/><circle cx="31" cy="34" r="14" opacity=".9"/><path d="M5 87c2-20 11-32 25-35 4 6 10 10 17 12-8 5-13 13-15 23H5z" opacity=".9"/><circle cx="113" cy="34" r="14" opacity=".9"/><path d="M139 87c-2-20-11-32-25-35-4 6-10 10-17 12 8 5 13 13 15 23h27z" opacity=".9"/><circle cx="116" cy="69" r="23" fill="#0f66c7" stroke="#fbfcff" stroke-width="6"/><path d="M116 57v24M104 69h24" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>'}
function waves(){return '<div class="waves"><svg viewBox="0 0 390 112" preserveAspectRatio="none"><path d="M0 40C60 4 102 21 151 48c55 30 96 33 142 8 38-21 68-20 97 1v55H0V40z" fill="#e1efff"/><path d="M0 59c51-23 95-11 139 13 53 28 103 27 151 2 39-20 70-17 100 2v36H0V59z" fill="#cde3fb"/><path d="M0 75c60-18 104-3 151 15 49 19 91 12 135-6 39-16 73-10 104 8v7H0V85z" fill="#b9d8f7" opacity=".75"/></svg></div>'}
function header(title,left,right){return '<div class="topbar"><div>'+(left||'')+'</div><h1>'+title+'</h1><div>'+(right||'')+'</div></div>'}
function iconButton(name,label,action){return '<button class="icon-btn" type="button" aria-label="'+label+'" data-action="'+action+'">'+icon(name)+'</button>'}
function locationCard(loc){const selected=loc.id===state.locationId?' selected':'';return '<button type="button" class="location-card'+selected+'" data-location="'+loc.id+'">'+icon('building')+'<span><strong>'+loc.name+'</strong><span>'+loc.address+'</span></span><span class="radio"></span></button>'}
function employeeRow(emp){const rec=recordFor(emp.id);let right=icon('chevron');if(rec&&rec.in&&!rec.out)right='<span class="row-status">'+icon('check')+'<span>Checked In<br>'+shortTime(parseTime(rec.in))+'</span></span>';if(rec&&rec.out)right='<span class="row-status">'+icon('check')+'<span>Checked Out<br>'+shortTime(parseTime(rec.out))+'</span></span>';return '<button type="button" class="employee-row" data-employee="'+emp.id+'"><span class="avatar">'+emp.initials+'</span><span><strong>'+emp.name+'</strong><small>'+emp.id+'</small></span>'+right+'</button>'}
function profileCard(emp,variant){return '<div class="profile-card '+(variant||'')+'"><span class="avatar profile-avatar">'+icon('userSolid')+'</span><span><strong>'+emp.name+'</strong><small>Emp ID: '+emp.id+'</small></span></div>'}
function summaryCard(rec,title){const checkIn=rec&&rec.in?clockTime(parseTime(rec.in)):'--';const checkOut=rec&&rec.out?clockTime(parseTime(rec.out)):'--';title=title||'Today\'s Attendance';return '<div class="summary-card"><div class="summary-title">'+icon('calendar')+title+'</div><div class="summary-grid"><div><small>Check In</small><strong>'+checkIn+'</strong></div><div><small>Check Out</small><strong>'+checkOut+'</strong></div></div></div>'}
function locationMini(){const loc=currentLocation();return '<div class="location-mini">'+icon('pinSolid')+'<span><small>Location</small><strong>'+loc.name+'</strong></span><button type="button" data-action="change-location">Change</button></div>'}
function renderLogin(){return '<section class="screen login-screen"><div class="logo-wrap">'+referenceArtImg('login','login-art')+'</div><h1 class="login-title">Attendance</h1><p class="tagline">Track. Manage. Grow.</p><form style="display:contents" onsubmit="return false"><label class="field">'+icon('user')+'<input id="userId" autocomplete="username" placeholder="User ID"></label><label class="field">'+icon('lock')+'<input id="password" type="password" autocomplete="current-password" placeholder="Password"><span class="trailing">'+icon('eyeOff')+'</span></label></form><button class="primary-btn" type="button" data-action="login">Login</button><div class="divider">or</div><button class="link-btn" type="button">Forgot Password?</button>'+waves()+'</section>'}
function renderLocation(){return '<section class="screen">'+header('Select Location',iconButton('back','Back','login'))+referenceArtImg('map','map-art-img')+'<h2 class="screen-title">Choose Your Location</h2><p class="screen-sub">Select the location to mark attendance</p><div class="location-list">'+locations.map(locationCard).join('')+'</div><button class="primary-btn" type="button" data-action="choose-location">Continue</button></section>'}
function renderSelectEmployee(){const loc=currentLocation(),d=new Date(),q=state.search.trim().toLowerCase();const list=employees.filter(e=>!q||e.name.toLowerCase().includes(q)||e.id.toLowerCase().includes(q));return '<section class="screen select-screen">'+header('Attendance',iconButton('menu','Today attendance','today'),iconButton('logout','Logout','login'))+'<div class="info-strip"><span class="left">'+icon('pin')+'<span>'+loc.name+'</span></span><span class="right">'+icon('calendar')+'<span>'+dateOnly(d)+'<small>'+dayName(d)+'</small></span></span></div><div class="select-panel"><div class="select-hero">'+referenceArtImg('select','select-art-img')+'<h2>Select Employee</h2><p>Choose an employee to mark attendance</p></div><label class="field search-box">'+icon('search')+'<input id="employeeSearch" placeholder="Search employee..." value="'+esc(state.search)+'"></label></div><div class="employee-list">'+(list.length?list.map(employeeRow).join(''):'<div class="empty-state">No employee matches this search.</div>')+'</div></section>'}
function renderPreCheck(){const emp=currentEmployee();return '<section class="screen pre-screen">'+header('Attendance',iconButton('menu','Employee list','select'),iconButton('logout','Logout','login'))+profileCard(emp)+locationMini()+'<div class="pre-panel"><div class="detail-center">'+referenceArtImg('clock','clock-art-img')+'<h2>Check In</h2><p>Mark your check-in time</p><button class="tap-card" type="button" data-action="checkin">'+icon('clock')+'Tap to Mark Check-In</button></div>'+summaryCard(recordFor(emp.id))+'</div></section>'}
function renderConfirm(){const emp=currentEmployee(),rec=recordFor(emp.id),t=rec&&rec.in?parseTime(rec.in):new Date();return '<section class="screen">'+header('Attendance',iconButton('back','Back','select'),'')+'<div class="confirm-top"><span class="avatar">'+emp.initials+'</span><strong>'+emp.name+'</strong><small>'+emp.id+'</small>'+referenceArtImg('rays','check-art-img rays-art')+'<h2 class="status-title">Checked In</h2><div class="status-time">'+clockTime(t)+'</div><div class="status-date">'+dateLine(t)+'</div></div><div class="confirm-actions"><button class="outline-btn" type="button" data-action="add-another">'+icon('plusCircle')+'Add Another Employee</button><button class="primary-btn" type="button" data-action="go-checkout">Mark Check Out</button></div></section>'}
function renderAddAnother(){return '<section class="screen">'+header('Add Another Employee',iconButton('back','Back','confirm'),'')+'<div class="add-hero">'+referenceArtImg('add','add-art-img')+'<h2>Check-in Another Employee?</h2><p>You can add another employee before checking out.</p><button class="primary-btn" type="button" data-action="add-employee">Add Employee</button><div style="height:10px"></div><button class="outline-btn" type="button" data-action="go-checkout">Go to Check Out</button></div></section>'}
function todayRow(item){const rec=item.record,out=rec.out?'Checked Out':'Checked In',t=rec.out?parseTime(rec.out):parseTime(rec.in);return '<button type="button" class="today-row" data-status-employee="'+item.employee.id+'"><span class="avatar">'+item.employee.initials+'</span><span><strong>'+item.employee.name+'</strong></span><span class="row-status"><span>'+out+'<br>'+shortTime(t)+'</span>'+icon('checkCircle')+'</span></button>'}
function renderToday(){const list=checkedRecords(),open=openRecords(),n=open.length;return '<section class="screen">'+header('Attendance',iconButton('back','Back','select'),'')+'<div class="today-card"><div class="today-heading">Today\'s Attendance</div>'+(list.length?list.map(todayRow).join(''):'<div class="empty-state">No employee has checked in yet.</div>')+'</div><div class="checkout-panel"><div class="checkout-label">'+icon('clock')+'Check Out</div><p>Mark check-out time for all checked-in employees</p><button class="primary-btn" type="button" data-action="checkout-all" '+(n?'':'disabled')+'>'+icon('logout')+'Mark Check Out</button></div><div class="note-card">'+icon('info')+'<span>Check-out will be recorded for<br><strong>'+n+' employee'+(n===1?'':'s')+'</strong></span></div></section>'}
function renderStatus(){const emp=currentEmployee(),rec=recordFor(emp.id),now=new Date();return '<section class="screen">'+header('Attendance',iconButton('menu','Today attendance','today'),iconButton('logout','Logout','login'))+profileCard(emp,'large')+'<div class="status-panel"><div class="status-card-center">'+referenceArtImg('halo','check-art-img halo-art')+'<h2>Checked In</h2><div class="current-time">'+clockTime(now)+'</div><div class="status-date">'+dateLine(now)+'</div></div><div class="divider-line"></div><button class="outline-btn" type="button" data-action="checkout-one">'+icon('clock')+'Mark Check Out</button></div>'+summaryCard(rec)+'</section>'}
function renderComplete(){const d=new Date(),n=checkedRecords().filter(x=>x.record.out).length;return '<section class="screen">'+header('Attendance',iconButton('back','Back','today'),'')+'<div class="complete-screen">'+referenceArtImg('rays','check-art-img rays-art')+'<h2>Checked Out</h2><div class="time">'+clockTime(d)+'</div><p>'+dateLine(d)+'<br>'+n+' employee record'+(n===1?'':'s')+' updated.</p><button class="primary-btn" type="button" data-action="select">Back to Attendance</button><div style="height:10px"></div><button class="outline-btn" type="button" data-action="login">Done</button></div></section>'}
function render(){statusTime.textContent=statusClock(new Date());const views={login:renderLogin,location:renderLocation,select:renderSelectEmployee,pre:renderPreCheck,confirm:renderConfirm,add:renderAddAnother,today:renderToday,status:renderStatus,complete:renderComplete};app.innerHTML=(views[state.screen]||renderLogin)();const search=document.getElementById('employeeSearch');if(search){search.addEventListener('input',e=>{state.search=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('employeeSearch');next.focus();next.setSelectionRange(pos,pos)})}}
function go(screen){state.screen=screen;render()}
function markCheckin(){const recs=records();if(recs[state.employeeId]&&recs[state.employeeId].in&&!recs[state.employeeId].out){go('status');return}recs[state.employeeId]={in:nowIso(),out:null};save();go('confirm')}
function checkoutOne(){const rec=recordFor(state.employeeId);if(rec&&rec.in&&!rec.out){rec.out=nowIso();save()}go('today')}
function checkoutAll(){const recs=records(),out=nowIso();Object.keys(recs).forEach(id=>{if(recs[id]&&recs[id].in&&!recs[id].out)recs[id].out=out});save();go('complete')}
app.addEventListener('click',event=>{const locBtn=event.target.closest('[data-location]');if(locBtn){state.locationId=locBtn.dataset.location;render();return}const empBtn=event.target.closest('[data-employee]');if(empBtn){state.employeeId=empBtn.dataset.employee;const rec=recordFor(state.employeeId);go(rec&&rec.in?'status':'pre');return}const statusBtn=event.target.closest('[data-status-employee]');if(statusBtn){state.employeeId=statusBtn.dataset.statusEmployee;go('status');return}const actionBtn=event.target.closest('[data-action]');if(!actionBtn)return;const action=actionBtn.dataset.action;
if(action==='login')go('location');if(action==='choose-location')go('select');if(action==='select')go('select');if(action==='today')go('today');if(action==='change-location')go('location');if(action==='checkin')markCheckin();if(action==='add-another')go('add');if(action==='add-employee')go('select');if(action==='go-checkout')go('today');if(action==='checkout-all')checkoutAll();if(action==='checkout-one')checkoutOne();if(action==='confirm')go('confirm')});
setInterval(()=>{statusTime.textContent=statusClock(new Date());if(state.screen==='status')render()},30000);render();
})();
</script>
